services:
  mongodb:
    image: mongo:7.0
    container_name: clinic-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: clinic_db
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: clinic-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGO_HOST: clinic-mongodb
      MONGO_PORT: 27017
      MONGO_DB: clinic_db
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data: