<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Clinic Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/navbar :: globalStyles}"></th:block>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="cms-main">
    <div class="cms-topbar">
        <div>
            <div class="cms-topbar-title">Dashboard</div>
            <div class="cms-topbar-sub">Overview of clinic operations</div>
        </div>
    </div>

    <div class="cms-content">

        <!-- Stat Cards -->
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:32px;">

            <div class="stat-card teal">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
                    <div class="stat-icon teal">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    </div>
                </div>
                <div class="stat-label">Total Patients</div>
                <div class="stat-value" th:text="${stats.totalPatients}">0</div>
                <a th:href="@{/patients}" class="stat-link" style="display:inline-flex;align-items:center;gap:4px;margin-top:10px;">
                    View all
                    <svg viewBox="0 0 24 24" fill="currentColor" style="width:12px;height:12px;"><path d="M8.59 16.58L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
                </a>
            </div>

            <div class="stat-card green">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
                    <div class="stat-icon green">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 8 1.34 8 4v2H4v-2c0-2.66 5.3-4 8-4zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm6 6.5v1h1.5v1H18v1h-1v-1h-1.5v-1H17v-1h1z"/></svg>
                    </div>
                </div>
                <div class="stat-label">Total Doctors</div>
                <div class="stat-value" th:text="${stats.totalDoctors}">0</div>
                <a th:href="@{/doctors}" class="stat-link" style="display:inline-flex;align-items:center;gap:4px;margin-top:10px;">
                    View all
                    <svg viewBox="0 0 24 24" fill="currentColor" style="width:12px;height:12px;"><path d="M8.59 16.58L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
                </a>
            </div>

            <div class="stat-card blue">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
                    <div class="stat-icon blue">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
                    </div>
                </div>
                <div class="stat-label">Appointments</div>
                <div class="stat-value" th:text="${stats.totalAppointments}">0</div>
                <a th:href="@{/appointments}" class="stat-link" style="display:inline-flex;align-items:center;gap:4px;margin-top:10px;">
                    View all
                    <svg viewBox="0 0 24 24" fill="currentColor" style="width:12px;height:12px;"><path d="M8.59 16.58L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
                </a>
            </div>

            <div class="stat-card amber">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
                    <div class="stat-icon amber">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 14l-4-4 1.41-1.41L12 14.17l6.59-6.59L20 9l-8 8z"/></svg>
                    </div>
                </div>
                <div class="stat-label">Prescriptions</div>
                <div class="stat-value" th:text="${stats.totalPrescriptions}">0</div>
                <a th:href="@{/prescriptions}" class="stat-link" style="display:inline-flex;align-items:center;gap:4px;margin-top:10px;">
                    View all
                    <svg viewBox="0 0 24 24" fill="currentColor" style="width:12px;height:12px;"><path d="M8.59 16.58L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
                </a>
            </div>

            <div class="stat-card coral">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
                    <div class="stat-icon coral">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 9h-2v2H9v2h2v2h2v-2h2v-2h-2v-2zm3-10v5h5l-5-5z"/></svg>
                    </div>
                </div>
                <div class="stat-label">Medical Records</div>
                <div class="stat-value" th:text="${stats.totalMedicalRecords}">0</div>
                <a th:href="@{/medical-records}" class="stat-link" style="display:inline-flex;align-items:center;gap:4px;margin-top:10px;">
                    View all
                    <svg viewBox="0 0 24 24" fill="currentColor" style="width:12px;height:12px;"><path d="M8.59 16.58L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
                </a>
            </div>

        </div>

        <!-- Quick Actions -->
        <h2 style="font-size:15px;font-weight:600;margin-bottom:16px;color:var(--text-primary);">Quick Actions</h2>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;">

            <a th:href="@{/patients/new}" class="quick-action" sec:authorize="hasAnyRole('ADMIN', 'RECEPTIONIST')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V8H4v2H2v2h2v2h2v-2h2v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span class="quick-action-label">Add Patient</span>
            </a>

            <a th:href="@{/appointments/new}" class="quick-action" sec:authorize="hasAnyRole('ADMIN', 'RECEPTIONIST')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
                <span class="quick-action-label">Book Appointment</span>
            </a>

            <a th:href="@{/prescriptions/new}" class="quick-action" sec:authorize="hasAnyRole('ADMIN', 'DOCTOR')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 14l-4-4 1.41-1.41L12 14.17l6.59-6.59L20 9l-8 8z"/></svg>
                <span class="quick-action-label">Write Prescription</span>
            </a>

            <a th:href="@{/medical-records/new}" class="quick-action" sec:authorize="hasAnyRole('ADMIN', 'DOCTOR')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 9h-2v2H9v2h2v2h2v-2h2v-2h-2v-2zm3-10v5h5l-5-5z"/></svg>
                <span class="quick-action-label">Add Medical Record</span>
            </a>

        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

</body>
</html>
