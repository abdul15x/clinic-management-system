<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${patient} ? 'Edit Patient' : 'Add Patient'">Add Patient</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/navbar :: globalStyles}"></th:block>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="cms-main">
    <div class="cms-topbar">
        <div>
            <div class="cms-topbar-title" th:text="${patient} ? 'Edit Patient' : 'Add New Patient'">Add New Patient</div>
            <div class="cms-topbar-sub">Fill in the patient details below</div>
        </div>
    </div>

    <div class="cms-content">
        <div style="max-width:640px;">
            <div class="cms-card">
                <div class="cms-card-header">
                    <svg viewBox="0 0 24 24" fill="var(--teal)" style="width:20px;height:20px;"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V8H4v2H2v2h2v2h2v-2h2v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <h5 th:text="${patient} ? 'Edit Patient' : 'New Patient'">New Patient</h5>
                </div>
                <div class="cms-card-body">
                    <form th:action="${patient} ? @{/patients/{id}/update(id=${patient.patientId})} : @{/patients/create}"
                          th:object="${patientRequest}" method="post">

                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
                            <div style="grid-column:1/-1;">
                                <label class="cms-form-label">Full Name</label>
                                <input type="text" class="cms-form-control"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                       th:field="*{name}" placeholder="Enter full name">
                                <div class="cms-invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div>
                                <label class="cms-form-label">Email</label>
                                <input type="email" class="cms-form-control"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                       th:field="*{email}" placeholder="email@example.com">
                                <div class="cms-invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div>
                                <label class="cms-form-label">Phone</label>
                                <input type="text" class="cms-form-control"
                                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                       th:field="*{phone}" placeholder="+92 300 0000000">
                                <div class="cms-invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>

                            <div>
                                <label class="cms-form-label">Gender</label>
                                <select class="cms-form-control"
                                        th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid' : ''"
                                        th:field="*{gender}">
                                    <option value="">Select Gender</option>
                                    <option value="MALE">Male</option>
                                    <option value="FEMALE">Female</option>
                                    <option value="OTHER">Other</option>
                                </select>
                                <div class="cms-invalid-feedback" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                            </div>

                            <div>
                                <label class="cms-form-label">Date of Birth</label>
                                <input type="date" class="cms-form-control"
                                       th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid' : ''"
                                       th:field="*{dateOfBirth}">
                                <div class="cms-invalid-feedback" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                            </div>

                            <div>
                                <label class="cms-form-label">Blood Group</label>
                                <select class="cms-form-control"
                                        th:classappend="${#fields.hasErrors('bloodGroup')} ? 'is-invalid' : ''"
                                        th:field="*{bloodGroup}">
                                    <option value="">Select Blood Group</option>
                                    <option value="A_POSITIVE">A+</option>
                                    <option value="A_NEGATIVE">A-</option>
                                    <option value="B_POSITIVE">B+</option>
                                    <option value="B_NEGATIVE">B-</option>
                                    <option value="AB_POSITIVE">AB+</option>
                                    <option value="AB_NEGATIVE">AB-</option>
                                    <option value="O_POSITIVE">O+</option>
                                    <option value="O_NEGATIVE">O-</option>
                                </select>
                                <div class="cms-invalid-feedback" th:if="${#fields.hasErrors('bloodGroup')}" th:errors="*{bloodGroup}"></div>
                            </div>

                            <div style="grid-column:1/-1;">
                                <label class="cms-form-label">Address</label>
                                <textarea class="cms-form-control" th:field="*{address}" rows="3" placeholder="Street, City, Country"></textarea>
                            </div>
                        </div>

                        <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:16px;">
                            <a th:href="@{/patients}" class="btn-cms btn-outline-cms">Cancel</a>
                            <button type="submit" class="btn-cms btn-primary-cms"
                                    th:text="${patient} ? 'Update Patient' : 'Create Patient'">Create Patient</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

</body>
</html>
