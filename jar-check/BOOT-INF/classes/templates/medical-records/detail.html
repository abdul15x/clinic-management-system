<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Record Details | Clinic Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/navbar :: globalStyles}"></th:block>

</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="cms-main">
    <div class="cms-topbar">
        <div>
            <div class="cms-topbar-title">Medical Record Details</div>
            <div class="cms-topbar-sub" th:text="'ID: ' + ${record.recordId}">ID</div>
        </div>
        <div style="display:flex;gap:8px;">
            <a th:href="@{/medical-records/{id}/edit(id=${record.recordId})}" class="btn-cms btn-warning-cms" sec:authorize="hasAnyRole('ADMIN', 'DOCTOR')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.21a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                Edit
            </a>
            <a th:href="@{/medical-records/{id}/delete(id=${record.recordId})}" class="btn-cms btn-danger-cms" sec:authorize="hasRole('ADMIN')"
               onclick="return confirm('Are you sure?')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                Delete
            </a>
        </div>
    </div>

    <div class="cms-content">
        <div style="max-width:720px;">
            <div class="cms-card">
                <div class="cms-card-header">
                    <div style="width:40px;height:40px;background:var(--coral);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                        <svg viewBox="0 0 24 24" fill="#fff" style="width:22px;height:22px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 9h-2v2H9v2h2v2h2v-2h2v-2h-2v-2zm3-10v5h5l-5-5z"/></svg>
                    </div>
                    <div>
                        <h5 th:text="'Record #' + ${record.recordId}">Record</h5>
                        <div style="font-size:12px;color:var(--text-muted);" th:text="${record.createdAt}"></div>
                    </div>
                </div>
                <div class="cms-card-body">
                    <div class="detail-row">
                        <span class="detail-label">Patient</span>
                        <span class="detail-value" th:text="${record.patientName} + ' (' + ${record.patientId} + ')'"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Doctor</span>
                        <span class="detail-value" th:text="${record.doctorName} + ' (' + ${record.doctorId} + ')'"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Created At</span>
                        <span class="detail-value muted" th:text="${record.createdAt}"></span>
                    </div>

                    <div style="margin-top:16px;">
                        <div class="detail-block-label">Diagnosis</div>
                        <div class="detail-block-value" th:text="${record.diagnosis}"></div>
                    </div>

                    <div style="margin-top:16px;">
                        <div class="detail-block-label">Treatment</div>
                        <div class="detail-block-value" th:text="${record.treatment}"></div>
                    </div>

                    <div style="margin-top:16px;">
                        <div class="detail-block-label">Notes</div>
                        <div class="detail-block-value" th:text="${record.notes} ?: '—'"></div>
                    </div>
                </div>
            </div>

            <div style="margin-top:16px;">
                <a th:href="@{/medical-records}" class="btn-cms btn-outline-cms">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    Back to Medical Records
                </a>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

</body>
</html>
