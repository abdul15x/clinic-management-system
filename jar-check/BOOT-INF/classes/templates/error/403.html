<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 text-center">
            <div class="card shadow">
                <div class="card-body p-5">
                    <i class="bi bi-shield-exclamation text-danger display-1"></i>
                    <h1 class="display-1 text-danger fw-bold">403</h1>
                    <h3 class="mb-3">Access Denied</h3>
                    <p class="text-muted mb-4">You do not have permission to access this resource.</p>
                    <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> Go to Homepage</a>
                    <a th:href="@{/login}" class="btn btn-outline-primary ms-2"><i class="bi bi-box-arrow-in-right"></i> Login</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
