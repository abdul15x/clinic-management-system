spring:
  application:
    name: clinic-management-system

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html

server:
  port: ${PORT:8080}

  error:
    whitelabel:
      enabled: false
    path: /error

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true