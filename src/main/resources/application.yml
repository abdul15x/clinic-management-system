spring:
  application:
    name: clinic-management-system
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/clinic_db}
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html

server:
  port: 8080
  server:
    error:
      whitelabel:
        enabled: false
      path: /error
      spring doc:
        api-docs:
          path: /api-docs
        swagger-ui:
          path: /swagger-ui.html
          operationsSorter: method
          tagsSorter: alpha
          tryItOutEnabled: true