<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Record Details - Clinic Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Clinic Management System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/patients">Patients</a></li>
                <li class="nav-item"><a class="nav-link" href="/doctors">Doctors</a></li>
                <li class="nav-item"><a class="nav-link" href="/appointments">Appointments</a></li>
                <li class="nav-item"><a class="nav-link" href="/prescriptions">Prescriptions</a></li>
                <li class="nav-item"><a class="nav-link active" href="/medical-records">Medical Records</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Medical Record Details</h2>
    <div class="card mt-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${record.recordId}"></h5>
            <p class="card-text"><strong>Patient:</strong> <span th:text="${record.patientName}"></span> (<span th:text="${record.patientId}"></span>)</p>
            <p class="card-text"><strong>Doctor:</strong> <span th:text="${record.doctorName}"></span> (<span th:text="${record.doctorId}"></span>)</p>
            <p class="card-text"><strong>Diagnosis:</strong> <span th:text="${record.diagnosis}"></span></p>
            <p class="card-text"><strong>Treatment:</strong> <span th:text="${record.treatment}"></span></p>
            <p class="card-text"><strong>Notes:</strong> <span th:text="${record.notes}"></span></p>
            <p class="card-text"><strong>Created:</strong> <span th:text="${record.createdAt}"></span></p>
        </div>
    </div>
    <div class="mt-3">
        <a href="/medical-records" class="btn btn-secondary">Back to List</a>
        <a th:href="@{/medical-records/{id}/edit(id=${record.recordId})}" class="btn btn-warning" sec:authorize="hasAnyRole('ADMIN', 'DOCTOR')">Edit</a>
        <a th:href="@{/medical-records/{id}/delete(id=${record.recordId})}" class="btn btn-danger" sec:authorize="hasRole('ADMIN')"
           onclick="return confirm('Are you sure?')">Delete</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
