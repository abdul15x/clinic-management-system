<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${record} ? 'Edit Medical Record' : 'Add Medical Record'">Add Medical Record</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Clinic Management System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/patients">Patients</a></li>
                <li class="nav-item"><a class="nav-link" href="/doctors">Doctors</a></li>
                <li class="nav-item"><a class="nav-link" href="/appointments">Appointments</a></li>
                <li class="nav-item"><a class="nav-link" href="/prescriptions">Prescriptions</a></li>
                <li class="nav-item"><a class="nav-link active" href="/medical-records">Medical Records</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${record} ? 'Edit Medical Record' : 'Add Medical Record'">Add Medical Record</h4>
                </div>
                <div class="card-body">
                    <form th:action="${record} ? @{/medical-records/{id}/update(id=${record.recordId})} : @{/medical-records/create}"
                          th:object="${recordRequest}" method="post">

                        <!-- Patient -->
                        <div class="mb-3">
                            <label class="form-label">Patient</label>
                            <select class="form-select"
                                    th:classappend="${#fields.hasErrors('patientId')} ? 'is-invalid' : ''"
                                    th:field="*{patientId}">
                                <option value="">Select Patient</option>
                                <option th:each="p : ${patients}" th:value="${p.patientId}" th:text="${p.name} + ' (' + ${p.patientId} + ')'"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('patientId')}" th:errors="*{patientId}"></div>
                        </div>

                        <!-- Doctor -->
                        <div class="mb-3">
                            <label class="form-label">Doctor</label>
                            <select class="form-select"
                                    th:classappend="${#fields.hasErrors('doctorId')} ? 'is-invalid' : ''"
                                    th:field="*{doctorId}">
                                <option value="">Select Doctor</option>
                                <option th:each="d : ${doctors}" th:value="${d.doctorId}" th:text="${d.name} + ' - ' + ${d.specialization}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}"></div>
                        </div>

                        <!-- Diagnosis -->
                        <div class="mb-3">
                            <label class="form-label">Diagnosis</label>
                            <textarea class="form-control" th:field="*{diagnosis}" rows="3"
                                      th:classappend="${#fields.hasErrors('diagnosis')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('diagnosis')}" th:errors="*{diagnosis}"></div>
                        </div>

                        <!-- Treatment -->
                        <div class="mb-3">
                            <label class="form-label">Treatment</label>
                            <textarea class="form-control" th:field="*{treatment}" rows="3"
                                      th:classappend="${#fields.hasErrors('treatment')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('treatment')}" th:errors="*{treatment}"></div>
                        </div>

                        <!-- Notes -->
                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            <textarea class="form-control" th:field="*{notes}" rows="3"
                                      th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/medical-records" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary" th:text="${record} ? 'Update Record' : 'Add Record'">Add Record</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
