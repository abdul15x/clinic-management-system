<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${doctor} ? 'Edit Doctor' : 'Add Doctor'">Add Doctor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/static">Clinic Management System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/static">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/patients">Patients</a></li>
                <li class="nav-item"><a class="nav-link active" href="/doctors">Doctors</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${doctor} ? 'Edit Doctor' : 'Add New Doctor'">Add New Doctor</h4>
                </div>
                <div class="card-body">
                    <form th:action="${doctor} ? @{/doctors/{id}/update(id=${doctor.doctorId})} : @{/doctors/create}"
                          th:object="${doctorRequest}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" th:field="*{phone}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Specialization</label>
                            <select class="form-select" th:field="*{specialization}" required>
                                <option value="">Select Specialization</option>
                                <option th:each="spec : ${specializations}"
                                        th:value="${spec}"
                                        th:text="${spec}">CARDIOLOGY</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Qualification</label>
                            <input type="text" class="form-control" th:field="*{qualification}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Experience (Years)</label>
                            <input type="number" class="form-control" th:field="*{experience}" required min="0">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Availability</label>
                            <input type="text" class="form-control" th:field="*{availability}" placeholder="e.g., Mon-Fri 9AM-5PM">
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/doctors" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary" th:text="${doctor} ? 'Update Doctor' : 'Create Doctor'">Create Doctor</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
