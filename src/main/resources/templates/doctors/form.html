<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${doctor} ? 'Edit Doctor' : 'Add Doctor'">Add Doctor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-person-badge"></i> <span th:text="${doctor} ? 'Edit Doctor' : 'Add New Doctor'">Add New Doctor</span></h4>
                </div>
                <div class="card-body">
                    <form th:action="${doctor} ? @{/doctors/{id}/update(id=${doctor.doctorId})} : @{/doctors/create}"
                          th:object="${doctorRequest}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                   th:field="*{name}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   th:field="*{email}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                   th:field="*{phone}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Specialization</label>
                            <select class="form-select"
                                    th:classappend="${#fields.hasErrors('specialization')} ? 'is-invalid' : ''"
                                    th:field="*{specialization}">
                                <option value="">Select Specialization</option>
                                <option th:each="spec : ${specializations}" th:value="${spec}" th:text="${spec}">CARDIOLOGY</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('specialization')}" th:errors="*{specialization}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Qualification</label>
                            <input type="text" class="form-control"
                                   th:classappend="${#fields.hasErrors('qualification')} ? 'is-invalid' : ''"
                                   th:field="*{qualification}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('qualification')}" th:errors="*{qualification}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Experience (Years)</label>
                            <input type="number" class="form-control"
                                   th:classappend="${#fields.hasErrors('experience')} ? 'is-invalid' : ''"
                                   th:field="*{experience}" min="0">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('experience')}" th:errors="*{experience}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Availability</label>
                            <input type="text" class="form-control" th:field="*{availability}" placeholder="e.g., Mon-Fri 9AM-5PM">
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/doctors}" class="btn btn-secondary"><i class="bi bi-x-lg"></i> Cancel</a>
                            <button type="submit" class="btn btn-primary" th:text="${doctor} ? 'Update Doctor' : 'Create Doctor'">Create Doctor</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
