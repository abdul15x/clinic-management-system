<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Details | Clinic Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 mb-5">
    <h2><i class="bi bi-person-badge"></i> Doctor Details</h2>
    <div class="card shadow-sm mt-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${doctor.name}"></h5>
            <hr>
            <div class="row">
                <div class="col-md-6">
                    <p class="card-text"><strong><i class="bi bi-hash"></i> Doctor ID:</strong> <span th:text="${doctor.doctorId}"></span></p>
                    <p class="card-text"><strong><i class="bi bi-envelope"></i> Email:</strong> <span th:text="${doctor.email}"></span></p>
                    <p class="card-text"><strong><i class="bi bi-telephone"></i> Phone:</strong> <span th:text="${doctor.phone}"></span></p>
                </div>
                <div class="col-md-6">
                    <p class="card-text"><strong><i class="bi bi-heart-pulse"></i> Specialization:</strong> <span th:text="${doctor.specialization}"></span></p>
                    <p class="card-text"><strong><i class="bi bi-mortarboard"></i> Qualification:</strong> <span th:text="${doctor.qualification}"></span></p>
                    <p class="card-text"><strong><i class="bi bi-clock-history"></i> Experience:</strong> <span th:text="${doctor.experience}"></span> years</p>
                </div>
            </div>
            <p class="card-text"><strong><i class="bi bi-calendar-week"></i> Availability:</strong> <span th:text="${doctor.availability}"></span></p>
        </div>
    </div>
    <div class="mt-3">
        <a th:href="@{/doctors}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
        <a th:href="@{/doctors/{id}/edit(id=${doctor.doctorId})}" class="btn btn-warning" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-pencil"></i> Edit
        </a>
        <a th:href="@{/doctors/{id}/delete(id=${doctor.doctorId})}" class="btn btn-danger" sec:authorize="hasRole('ADMIN')"
           onclick="return confirm('Are you sure?')">
            <i class="bi bi-trash"></i> Delete
        </a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
