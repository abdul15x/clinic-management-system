<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Details - Clinic Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Clinic Management System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/patients">Patients</a></li>
                <li class="nav-item"><a class="nav-link active" href="/doctors">Doctors</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" href="/login">Login</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" href="/register">Register</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="nav-link" sec:authentication="name"></span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>
                <li class="nav-item"><a class="nav-link" href="/appointments">Appointments</a></li>
                <li class="nav-item"><a class="nav-link" href="/prescriptions">Prescriptions</a></li>
                <li class="nav-item"><a class="nav-link" href="/medical-records">Medical Records</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Doctor Details</h2>
    <div class="card mt-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${doctor.name}"></h5>
            <p class="card-text"><strong>Doctor ID:</strong> <span th:text="${doctor.doctorId}"></span></p>
            <p class="card-text"><strong>Email:</strong> <span th:text="${doctor.email}"></span></p>
            <p class="card-text"><strong>Phone:</strong> <span th:text="${doctor.phone}"></span></p>
            <p class="card-text"><strong>Specialization:</strong> <span th:text="${doctor.specialization}"></span></p>
            <p class="card-text"><strong>Qualification:</strong> <span th:text="${doctor.qualification}"></span></p>
            <p class="card-text"><strong>Experience:</strong> <span th:text="${doctor.experience}"></span> years</p>
            <p class="card-text"><strong>Availability:</strong> <span th:text="${doctor.availability}"></span></p>
        </div>
    </div>
    <div class="mt-3">
        <a href="/doctors" class="btn btn-secondary">Back to List</a>
        <a th:href="@{/doctors/{id}/edit(id=${doctor.doctorId})}" class="btn btn-warning" sec:authorize="hasRole('ADMIN')">Edit</a>
        <a th:href="@{/doctors/{id}/delete(id=${doctor.doctorId})}" class="btn btn-danger" sec:authorize="hasRole('ADMIN')"
           onclick="return confirm('Are you sure?')">Delete</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
