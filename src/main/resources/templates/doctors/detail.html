<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Details | Clinic Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/navbar :: globalStyles}"></th:block>

</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="cms-main">
    <div class="cms-topbar">
        <div>
            <div class="cms-topbar-title">Doctor Details</div>
            <div class="cms-topbar-sub" th:text="${doctor.name}">Doctor Name</div>
        </div>
        <div style="display:flex;gap:8px;">
            <a th:href="@{/doctors/{id}/edit(id=${doctor.doctorId})}" class="btn-cms btn-warning-cms" sec:authorize="hasRole('ADMIN')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.21a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                Edit
            </a>
            <a th:href="@{/doctors/{id}/delete(id=${doctor.doctorId})}" class="btn-cms btn-danger-cms" sec:authorize="hasRole('ADMIN')"
               onclick="return confirm('Are you sure?')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                Delete
            </a>
        </div>
    </div>

    <div class="cms-content">
        <div style="max-width:720px;">
            <div class="cms-card">
                <div class="cms-card-header">
                    <div style="width:40px;height:40px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                        <svg viewBox="0 0 24 24" fill="#fff" style="width:22px;height:22px;"><path d="M12 12c2.7 0 8 1.34 8 4v2H4v-2c0-2.66 5.3-4 8-4zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm6 6.5v1h1.5v1H18v1h-1v-1h-1.5v-1H17v-1h1z"/></svg>
                    </div>
                    <div>
                        <h5 th:text="${doctor.name}">Doctor Name</h5>
                        <div style="font-size:12px;color:var(--text-muted);" th:text="'ID: ' + ${doctor.doctorId}"></div>
                    </div>
                </div>
                <div class="cms-card-body">
                    <div class="detail-row">
                        <span class="detail-label">Email</span>
                        <span class="detail-value" th:text="${doctor.email}"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Phone</span>
                        <span class="detail-value" th:text="${doctor.phone}"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Specialization</span>
                        <span class="cms-badge badge-green" th:text="${doctor.specialization}"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Qualification</span>
                        <span class="detail-value" th:text="${doctor.qualification}"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Experience</span>
                        <span class="detail-value" th:text="${doctor.experience} + ' years'"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Availability</span>
                        <span class="detail-value" th:text="${doctor.availability}"></span>
                    </div>
                </div>
            </div>

            <div style="margin-top:16px;">
                <a th:href="@{/doctors}" class="btn-cms btn-outline-cms">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    Back to Doctors
                </a>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

</body>
</html>
