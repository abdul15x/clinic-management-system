<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors | Clinic Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-person-badge"></i> Doctors</h2>
        <a th:href="@{/doctors/new}" class="btn btn-success" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-plus-lg"></i> Add Doctor
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Doctor ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Specialization</th>
                        <th>Qualification</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="doctor : ${doctors}">
                        <td th:text="${doctor.doctorId}"></td>
                        <td th:text="${doctor.name}"></td>
                        <td th:text="${doctor.email}"></td>
                        <td th:text="${doctor.phone}"></td>
                        <td th:text="${doctor.specialization}"></td>
                        <td th:text="${doctor.qualification}"></td>
                        <td class="text-end">
                            <a th:href="@{/doctors/{id}(id=${doctor.doctorId})}" class="btn btn-info btn-sm">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/doctors/{id}/edit(id=${doctor.doctorId})}" class="btn btn-warning btn-sm" sec:authorize="hasRole('ADMIN')">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/doctors/{id}/delete(id=${doctor.doctorId})}" class="btn btn-danger btn-sm" sec:authorize="hasRole('ADMIN')"
                               onclick="return confirm('Are you sure you want to delete this doctor?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <a th:href="@{/}" class="btn btn-secondary mt-3"><i class="bi bi-arrow-left"></i> Back to Home</a>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
