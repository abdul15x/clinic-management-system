<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${prescription} ? 'Edit Prescription' : 'Create Prescription'">Create Prescription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Clinic Management System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/patients">Patients</a></li>
                <li class="nav-item"><a class="nav-link" href="/doctors">Doctors</a></li>
                <li class="nav-item"><a class="nav-link" href="/appointments">Appointments</a></li>
                <li class="nav-item"><a class="nav-link active" href="/prescriptions">Prescriptions</a></li>
                <li class="nav-item"><a class="nav-link" href="/medical-records">Medical Records</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${prescription} ? 'Edit Prescription' : 'Create Prescription'">Create Prescription</h4>
                </div>
                <div class="card-body">
                    <form th:action="${prescription} ? @{/prescriptions/{id}/update(id=${prescription.prescriptionId})} : @{/prescriptions/create}"
                          th:object="${prescriptionRequest}" method="post">

                        <!-- Appointment -->
                        <div class="mb-3">
                            <label class="form-label">Appointment</label>
                            <select class="form-select"
                                    th:classappend="${#fields.hasErrors('appointmentId')} ? 'is-invalid' : ''"
                                    th:field="*{appointmentId}">
                                <option value="">Select Appointment</option>
                                <option th:each="a : ${appointments}" th:value="${a.appointmentId}" th:text="${a.appointmentId} + ' - ' + ${a.patientName} + ' with ' + ${a.doctorName}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('appointmentId')}" th:errors="*{appointmentId}"></div>
                        </div>

                        <!-- Patient -->
                        <div class="mb-3">
                            <label class="form-label">Patient</label>
                            <select class="form-select"
                                    th:classappend="${#fields.hasErrors('patientId')} ? 'is-invalid' : ''"
                                    th:field="*{patientId}">
                                <option value="">Select Patient</option>
                                <option th:each="p : ${patients}" th:value="${p.patientId}" th:text="${p.name} + ' (' + ${p.patientId} + ')'"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('patientId')}" th:errors="*{patientId}"></div>
                        </div>

                        <!-- Doctor -->
                        <div class="mb-3">
                            <label class="form-label">Doctor</label>
                            <select class="form-select"
                                    th:classappend="${#fields.hasErrors('doctorId')} ? 'is-invalid' : ''"
                                    th:field="*{doctorId}">
                                <option value="">Select Doctor</option>
                                <option th:each="d : ${doctors}" th:value="${d.doctorId}" th:text="${d.name} + ' - ' + ${d.specialization}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}"></div>
                        </div>

                        <!-- Medications -->
                        <div class="mb-3">
                            <label class="form-label">Medications</label>
                            <textarea class="form-control" th:field="*{medications}" rows="3"
                                      th:classappend="${#fields.hasErrors('medications')} ? 'is-invalid' : ''"
                                      placeholder="e.g., Paracetamol, Amoxicillin"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('medications')}" th:errors="*{medications}"></div>
                        </div>

                        <!-- Dosage -->
                        <div class="mb-3">
                            <label class="form-label">Dosage</label>
                            <input type="text" class="form-control" th:field="*{dosage}"
                                   th:classappend="${#fields.hasErrors('dosage')} ? 'is-invalid' : ''"
                                   placeholder="e.g., 500mg twice daily">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('dosage')}" th:errors="*{dosage}"></div>
                        </div>

                        <!-- Instructions -->
                        <div class="mb-3">
                            <label class="form-label">Instructions</label>
                            <textarea class="form-control" th:field="*{instructions}" rows="3"
                                      th:classappend="${#fields.hasErrors('instructions')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('instructions')}" th:errors="*{instructions}"></div>
                        </div>

                        <!-- Status (only on edit) -->
                        <div class="mb-3" th:if="${prescription != null}">
                            <label class="form-label">Status</label>
                            <select class="form-select" th:field="*{status}">
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/prescriptions" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary" th:text="${prescription} ? 'Update Prescription' : 'Create Prescription'">Create Prescription</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
