<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prescription Details | Clinic Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 mb-5">
    <h2><i class="bi bi-file-medical"></i> Prescription Details</h2>
    <div class="card shadow-sm mt-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${prescription.prescriptionId}"></h5>
            <hr>
            <div class="row">
                <div class="col-md-6">
                    <p class="card-text"><strong><i class="bi bi-hash"></i> Appointment:</strong> <span th:text="${prescription.appointmentId}"></span></p>
                    <p class="card-text"><strong><i class="bi bi-person"></i> Patient:</strong> <span th:text="${prescription.patientName}"></span> (<span th:text="${prescription.patientId}"></span>)</p>
                    <p class="card-text"><strong><i class="bi bi-person-badge"></i> Doctor:</strong> <span th:text="${prescription.doctorName}"></span> (<span th:text="${prescription.doctorId}"></span>)</p>
                </div>
                <div class="col-md-6">
                    <p class="card-text"><strong><i class="bi bi-capsule"></i> Medications:</strong> <span th:text="${prescription.medications}"></span></p>
                    <p class="card-text"><strong><i class="bi bi-droplet"></i> Dosage:</strong> <span th:text="${prescription.dosage}"></span></p>
                    <p class="card-text"><strong><i class="bi bi-flag"></i> Status:</strong>
                        <span class="badge"
                              th:classappend="${prescription.status.name() == 'ACTIVE'} ? 'bg-success' :
                                              (${prescription.status.name() == 'COMPLETED'} ? 'bg-primary' : 'bg-secondary')"
                              th:text="${prescription.status}"></span>
                    </p>
                </div>
            </div>
            <p class="card-text"><strong><i class="bi bi-sticky"></i> Instructions:</strong> <span th:text="${prescription.instructions}"></span></p>
            <p class="card-text text-muted small"><strong><i class="bi bi-clock-history"></i> Created:</strong> <span th:text="${prescription.createdAt}"></span></p>
        </div>
    </div>
    <div class="mt-3">
        <a th:href="@{/prescriptions}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
        <a th:href="@{/prescriptions/{id}/edit(id=${prescription.prescriptionId})}" class="btn btn-warning" sec:authorize="hasAnyRole('ADMIN', 'DOCTOR')">
            <i class="bi bi-pencil"></i> Edit
        </a>
        <a th:href="@{/prescriptions/{id}/delete(id=${prescription.prescriptionId})}" class="btn btn-danger" sec:authorize="hasRole('ADMIN')"
           onclick="return confirm('Are you sure?')">
            <i class="bi bi-trash"></i> Delete
        </a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
