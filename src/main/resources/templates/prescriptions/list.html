<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prescriptions - Clinic Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Clinic Management System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/patients">Patients</a></li>
                <li class="nav-item"><a class="nav-link" href="/doctors">Doctors</a></li>
                <li class="nav-item"><a class="nav-link" href="/appointments">Appointments</a></li>
                <li class="nav-item"><a class="nav-link active" href="/prescriptions">Prescriptions</a></li>
                <li class="nav-item"><a class="nav-link" href="/medical-records">Medical Records</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" href="/login">Login</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" href="/register">Register</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="nav-link" sec:authentication="name"></span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Prescriptions List</h2>
        <a href="/prescriptions/new" class="btn btn-success" sec:authorize="hasAnyRole('ADMIN', 'DOCTOR')">Create Prescription</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>Prescription ID</th>
                <th>Patient</th>
                <th>Doctor</th>
                <th>Medications</th>
                <th>Dosage</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${prescriptions}">
                <td th:text="${p.prescriptionId}"></td>
                <td th:text="${p.patientName}"></td>
                <td th:text="${p.doctorName}"></td>
                <td th:text="${#strings.abbreviate(p.medications, 30)}"></td>
                <td th:text="${#strings.abbreviate(p.dosage, 20)}"></td>
                <td>
                            <span class="badge"
                                  th:classappend="${p.status.name() == 'ACTIVE'} ? 'bg-success' :
                                                  (${p.status.name() == 'COMPLETED'} ? 'bg-primary' : 'bg-secondary')"
                                  th:text="${p.status}"></span>
                </td>
                <td>
                    <a th:href="@{/prescriptions/{id}(id=${p.prescriptionId})}" class="btn btn-info btn-sm">View</a>
                    <a th:href="@{/prescriptions/{id}/edit(id=${p.prescriptionId})}" class="btn btn-warning btn-sm" sec:authorize="hasAnyRole('ADMIN', 'DOCTOR')">Edit</a>
                    <a th:href="@{/prescriptions/{id}/delete(id=${p.prescriptionId})}" class="btn btn-danger btn-sm" sec:authorize="hasRole('ADMIN')"
                       onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a href="/" class="btn btn-secondary">Back to Home</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
