<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Details - Clinic Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Clinic Management System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="/patients">Patients</a></li>
                <li class="nav-item"><a class="nav-link" href="/doctors">Doctors</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" href="/login">Login</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" href="/register">Register</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="nav-link" sec:authentication="name"></span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Patient Details</h2>
    <div class="card mt-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${patient.name}"></h5>
            <p class="card-text"><strong>Patient ID:</strong> <span th:text="${patient.patientId}"></span></p>
            <p class="card-text"><strong>Email:</strong> <span th:text="${patient.email}"></span></p>
            <p class="card-text"><strong>Phone:</strong> <span th:text="${patient.phone}"></span></p>
            <p class="card-text"><strong>Gender:</strong> <span th:text="${patient.gender}"></span></p>
            <p class="card-text"><strong>Date of Birth:</strong> <span th:text="${patient.dateOfBirth}"></span></p>
            <p class="card-text"><strong>Blood Group:</strong> <span th:text="${patient.bloodGroup}"></span></p>
            <p class="card-text"><strong>Address:</strong> <span th:text="${patient.address}"></span></p>
        </div>
    </div>
    <div class="mt-3">
        <a href="/patients" class="btn btn-secondary">Back to List</a>
        <a th:href="@{/patients/{id}/edit(id=${patient.patientId})}" class="btn btn-warning" sec:authorize="hasAnyRole('ADMIN', 'RECEPTIONIST')">Edit</a>
        <a th:href="@{/patients/{id}/delete(id=${patient.patientId})}" class="btn btn-danger" sec:authorize="hasRole('ADMIN')"
           onclick="return confirm('Are you sure?')">Delete</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
