<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Details | Clinic Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 mb-5">
    <h2><i class="bi bi-person"></i> Patient Details</h2>
    <div class="card shadow-sm mt-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${patient.name}"></h5>
            <hr>
            <div class="row">
                <div class="col-md-6">
                    <p class="card-text"><strong><i class="bi bi-hash"></i> Patient ID:</strong> <span th:text="${patient.patientId}"></span></p>
                    <p class="card-text"><strong><i class="bi bi-envelope"></i> Email:</strong> <span th:text="${patient.email}"></span></p>
                    <p class="card-text"><strong><i class="bi bi-telephone"></i> Phone:</strong> <span th:text="${patient.phone}"></span></p>
                </div>
                <div class="col-md-6">
                    <p class="card-text"><strong><i class="bi bi-gender-ambiguous"></i> Gender:</strong> <span th:text="${patient.gender}"></span></p>
                    <p class="card-text"><strong><i class="bi bi-calendar"></i> Date of Birth:</strong> <span th:text="${patient.dateOfBirth}"></span></p>
                    <p class="card-text"><strong><i class="bi bi-droplet"></i> Blood Group:</strong> <span th:text="${patient.bloodGroup}"></span></p>
                </div>
            </div>
            <p class="card-text"><strong><i class="bi bi-geo-alt"></i> Address:</strong> <span th:text="${patient.address}"></span></p>
        </div>
    </div>
    <div class="mt-3">
        <a th:href="@{/patients}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
        <a th:href="@{/patients/{id}/edit(id=${patient.patientId})}" class="btn btn-warning" sec:authorize="hasAnyRole('ADMIN', 'RECEPTIONIST')">
            <i class="bi bi-pencil"></i> Edit
        </a>
        <a th:href="@{/patients/{id}/delete(id=${patient.patientId})}" class="btn btn-danger" sec:authorize="hasRole('ADMIN')"
           onclick="return confirm('Are you sure?')">
            <i class="bi bi-trash"></i> Delete
        </a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
