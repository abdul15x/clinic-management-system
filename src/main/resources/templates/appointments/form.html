<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${appointment} ? 'Edit Appointment' : 'Book Appointment'">Book Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-calendar-plus"></i> <span th:text="${appointment} ? 'Edit Appointment' : 'Book New Appointment'">Book New Appointment</span></h4>
                </div>
                <div class="card-body">
                    <form th:action="${appointment} ? @{/appointments/{id}/update(id=${appointment.appointmentId})} : @{/appointments/create}"
                          th:object="${appointmentRequest}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Patient</label>
                            <select class="form-select"
                                    th:classappend="${#fields.hasErrors('patientId')} ? 'is-invalid' : ''"
                                    th:field="*{patientId}">
                                <option value="">Select Patient</option>
                                <option th:each="p : ${patients}" th:value="${p.patientId}" th:text="${p.name} + ' (' + ${p.patientId} + ')'"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('patientId')}" th:errors="*{patientId}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Doctor</label>
                            <select class="form-select"
                                    th:classappend="${#fields.hasErrors('doctorId')} ? 'is-invalid' : ''"
                                    th:field="*{doctorId}">
                                <option value="">Select Doctor</option>
                                <option th:each="d : ${doctors}" th:value="${d.doctorId}" th:text="${d.name} + ' - ' + ${d.specialization}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Appointment Date</label>
                            <input type="date" class="form-control"
                                   th:classappend="${#fields.hasErrors('appointmentDate')} ? 'is-invalid' : ''"
                                   th:field="*{appointmentDate}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('appointmentDate')}" th:errors="*{appointmentDate}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Appointment Time</label>
                            <input type="time" class="form-control"
                                   th:classappend="${#fields.hasErrors('appointmentTime')} ? 'is-invalid' : ''"
                                   th:field="*{appointmentTime}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('appointmentTime')}" th:errors="*{appointmentTime}"></div>
                        </div>

                        <div class="mb-3" th:if="${appointment != null}">
                            <label class="form-label">Status</label>
                            <select class="form-select" th:field="*{status}">
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            <textarea class="form-control" th:field="*{notes}" rows="3"
                                      th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/appointments}" class="btn btn-secondary"><i class="bi bi-x-lg"></i> Cancel</a>
                            <button type="submit" class="btn btn-primary" th:text="${appointment} ? 'Update Appointment' : 'Book Appointment'">Book Appointment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
