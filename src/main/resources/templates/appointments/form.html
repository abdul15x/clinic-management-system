<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${appointment} ? 'Edit Appointment' : 'Book Appointment'">Book Appointment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/navbar :: globalStyles}"></th:block>

</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="cms-main">
    <div class="cms-topbar">
        <div>
            <div class="cms-topbar-title" th:text="${appointment} ? 'Edit Appointment' : 'Book New Appointment'">Book New Appointment</div>
            <div class="cms-topbar-sub">Fill in the appointment details below</div>
        </div>
    </div>

    <div class="cms-content">
        <div style="max-width:640px;">
            <div class="cms-card">
                <div class="cms-card-header">
                    <svg viewBox="0 0 24 24" fill="var(--teal)" style="width:20px;height:20px;"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
                    <h5 th:text="${appointment} ? 'Edit Appointment' : 'New Appointment'">New Appointment</h5>
                </div>
                <div class="cms-card-body">
                    <form th:action="${appointment} ? @{/appointments/{id}/update(id=${appointment.appointmentId})} : @{/appointments/create}"
                          th:object="${appointmentRequest}" method="post">

                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
                            <div>
                                <label class="cms-form-label">Patient</label>
                                <select class="cms-form-control"
                                        th:classappend="${#fields.hasErrors('patientId')} ? 'is-invalid' : ''"
                                        th:field="*{patientId}">
                                    <option value="">Select Patient</option>
                                    <option th:each="p : ${patients}" th:value="${p.patientId}" th:text="${p.name} + ' (' + ${p.patientId} + ')'"></option>
                                </select>
                                <div class="cms-invalid-feedback" th:if="${#fields.hasErrors('patientId')}" th:errors="*{patientId}"></div>
                            </div>

                            <div>
                                <label class="cms-form-label">Doctor</label>
                                <select class="cms-form-control"
                                        th:classappend="${#fields.hasErrors('doctorId')} ? 'is-invalid' : ''"
                                        th:field="*{doctorId}">
                                    <option value="">Select Doctor</option>
                                    <option th:each="d : ${doctors}" th:value="${d.doctorId}" th:text="${d.name} + ' - ' + ${d.specialization}"></option>
                                </select>
                                <div class="cms-invalid-feedback" th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}"></div>
                            </div>

                            <div>
                                <label class="cms-form-label">Appointment Date</label>
                                <input type="date" class="cms-form-control"
                                       th:classappend="${#fields.hasErrors('appointmentDate')} ? 'is-invalid' : ''"
                                       th:field="*{appointmentDate}">
                                <div class="cms-invalid-feedback" th:if="${#fields.hasErrors('appointmentDate')}" th:errors="*{appointmentDate}"></div>
                            </div>

                            <div>
                                <label class="cms-form-label">Appointment Time</label>
                                <input type="time" class="cms-form-control"
                                       th:classappend="${#fields.hasErrors('appointmentTime')} ? 'is-invalid' : ''"
                                       th:field="*{appointmentTime}">
                                <div class="cms-invalid-feedback" th:if="${#fields.hasErrors('appointmentTime')}" th:errors="*{appointmentTime}"></div>
                            </div>

                            <div th:if="${appointment != null}" style="grid-column:1/-1;">
                                <label class="cms-form-label">Status</label>
                                <select class="cms-form-control" th:field="*{status}">
                                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                                </select>
                            </div>

                            <div style="grid-column:1/-1;">
                                <label class="cms-form-label">Notes</label>
                                <textarea class="cms-form-control" th:field="*{notes}" rows="3" placeholder="Optional notes about the appointment"
                                          th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''"></textarea>
                                <div class="cms-invalid-feedback" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
                            </div>
                        </div>

                        <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:16px;">
                            <a th:href="@{/appointments}" class="btn-cms btn-outline-cms">Cancel</a>
                            <button type="submit" class="btn-cms btn-primary-cms"
                                    th:text="${appointment} ? 'Update Appointment' : 'Book Appointment'">Book Appointment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

</body>
</html>
