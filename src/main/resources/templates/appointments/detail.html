<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Details - Clinic Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Clinic Management System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/patients">Patients</a></li>
                <li class="nav-item"><a class="nav-link" href="/doctors">Doctors</a></li>
                <li class="nav-item"><a class="nav-link active" href="/appointments">Appointments</a></li>
                <li class="nav-item"><a class="nav-link" href="/prescriptions">Prescriptions</a></li>
                <li class="nav-item"><a class="nav-link" href="/medical-records">Medical Records</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Appointment Details</h2>
    <div class="card mt-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${appointment.appointmentId}"></h5>
            <p class="card-text"><strong>Patient:</strong> <span th:text="${appointment.patientName}"></span> (<span th:text="${appointment.patientId}"></span>)</p>
            <p class="card-text"><strong>Doctor:</strong> <span th:text="${appointment.doctorName}"></span> (<span th:text="${appointment.doctorId}"></span>)</p>
            <p class="card-text"><strong>Date:</strong> <span th:text="${appointment.appointmentDate}"></span></p>
            <p class="card-text"><strong>Time:</strong> <span th:text="${appointment.appointmentTime}"></span></p>
            <p class="card-text"><strong>Status:</strong>
                <span class="badge"
                      th:classappend="${appointment.status.name() == 'SCHEDULED'} ? 'bg-warning' :
                                          (${appointment.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-danger')"
                      th:text="${appointment.status}"></span>
            </p>
            <p class="card-text"><strong>Notes:</strong> <span th:text="${appointment.notes}"></span></p>
            <p class="card-text"><strong>Created:</strong> <span th:text="${appointment.createdAt}"></span></p>
        </div>
    </div>
    <div class="mt-3">
        <a href="/appointments" class="btn btn-secondary">Back to List</a>
        <a th:href="@{/appointments/{id}/edit(id=${appointment.appointmentId})}" class="btn btn-warning" sec:authorize="hasAnyRole('ADMIN', 'RECEPTIONIST')">Edit</a>
        <a th:href="@{/appointments/{id}/delete(id=${appointment.appointmentId})}" class="btn btn-danger" sec:authorize="hasRole('ADMIN')"
           onclick="return confirm('Are you sure?')">Delete</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
