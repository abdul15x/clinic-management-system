<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Clinic Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .stat-card { transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 mb-5">
    <h2 class="mb-4"><i class="bi bi-speedometer2"></i> Dashboard</h2>
    <p class="text-muted mb-4">Overview of clinic operations</p>

    <div class="row g-4">
        <!-- Total Patients -->
        <div class="col-md-4 col-lg-2-4">
            <div class="card stat-card text-white bg-primary h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title text-uppercase opacity-75">Total Patients</h6>
                            <h2 class="mb-0 fw-bold" th:text="${stats.totalPatients}">0</h2>
                        </div>
                        <i class="bi bi-people-fill fs-1 opacity-75"></i>
                    </div>
                    <a th:href="@{/patients}" class="text-white text-decoration-none small">View all <i class="bi bi-arrow-right"></i></a>
                </div>
            </div>
        </div>

        <!-- Total Doctors -->
        <div class="col-md-4 col-lg-2-4">
            <div class="card stat-card text-white bg-success h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title text-uppercase opacity-75">Total Doctors</h6>
                            <h2 class="mb-0 fw-bold" th:text="${stats.totalDoctors}">0</h2>
                        </div>
                        <i class="bi bi-person-badge-fill fs-1 opacity-75"></i>
                    </div>
                    <a th:href="@{/doctors}" class="text-white text-decoration-none small">View all <i class="bi bi-arrow-right"></i></a>
                </div>
            </div>
        </div>

        <!-- Total Appointments -->
        <div class="col-md-4 col-lg-2-4">
            <div class="card stat-card text-white bg-info h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title text-uppercase opacity-75">Appointments</h6>
                            <h2 class="mb-0 fw-bold" th:text="${stats.totalAppointments}">0</h2>
                        </div>
                        <i class="bi bi-calendar-check-fill fs-1 opacity-75"></i>
                    </div>
                    <a th:href="@{/appointments}" class="text-white text-decoration-none small">View all <i class="bi bi-arrow-right"></i></a>
                </div>
            </div>
        </div>

        <!-- Total Prescriptions -->
        <div class="col-md-4 col-lg-2-4">
            <div class="card stat-card text-white bg-warning h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title text-uppercase opacity-75">Prescriptions</h6>
                            <h2 class="mb-0 fw-bold" th:text="${stats.totalPrescriptions}">0</h2>
                        </div>
                        <i class="bi bi-file-medical-fill fs-1 opacity-75"></i>
                    </div>
                    <a th:href="@{/prescriptions}" class="text-white text-decoration-none small">View all <i class="bi bi-arrow-right"></i></a>
                </div>
            </div>
        </div>

        <!-- Total Medical Records -->
        <div class="col-md-4 col-lg-2-4">
            <div class="card stat-card text-white bg-danger h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title text-uppercase opacity-75">Medical Records</h6>
                            <h2 class="mb-0 fw-bold" th:text="${stats.totalMedicalRecords}">0</h2>
                        </div>
                        <i class="bi bi-journal-medical fs-1 opacity-75"></i>
                    </div>
                    <a th:href="@{/medical-records}" class="text-white text-decoration-none small">View all <i class="bi bi-arrow-right"></i></a>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="row mt-5">
        <div class="col-12">
            <h4 class="mb-3">Quick Actions</h4>
        </div>
        <div class="col-md-3 mb-3" sec:authorize="hasAnyRole('ADMIN', 'RECEPTIONIST')">
            <a th:href="@{/patients/new}" class="btn btn-outline-primary w-100 py-3">
                <i class="bi bi-person-plus-fill fs-4 d-block mb-2"></i>
                Add Patient
            </a>
        </div>
        <div class="col-md-3 mb-3" sec:authorize="hasAnyRole('ADMIN', 'RECEPTIONIST')">
            <a th:href="@{/appointments/new}" class="btn btn-outline-info w-100 py-3">
                <i class="bi bi-calendar-plus-fill fs-4 d-block mb-2"></i>
                Book Appointment
            </a>
        </div>
        <div class="col-md-3 mb-3" sec:authorize="hasAnyRole('ADMIN', 'DOCTOR')">
            <a th:href="@{/prescriptions/new}" class="btn btn-outline-warning w-100 py-3">
                <i class="bi bi-file-earmark-medical-fill fs-4 d-block mb-2"></i>
                Write Prescription
            </a>
        </div>
        <div class="col-md-3 mb-3" sec:authorize="hasAnyRole('ADMIN', 'DOCTOR')">
            <a th:href="@{/medical-records/new}" class="btn btn-outline-danger w-100 py-3">
                <i class="bi bi-journal-plus fs-4 d-block mb-2"></i>
                Add Medical Record
            </a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
